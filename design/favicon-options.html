<!doctype html>
<!-- Design preview (not app code): the favicon options for Nightreader beside the other
     baish.net icons, at the sizes a browser really uses, in light and dark tab strips. -->
<html lang="en-GB"><head><meta charset="utf-8"><title>Nightreader: favicon options</title>
<style>
  body { margin: 0; padding: 24px; background: #f5ead8; font: 14px/1.4 -apple-system, sans-serif; color: #201e1d; }
  h1 { font: 400 22px Georgia, serif; margin: 0 0 14px; }
  .row { display: flex; align-items: center; gap: 24px; margin-bottom: 22px; }
  .label { width: 200px; font-weight: 600; flex: none; }
  .label small { display: block; font-weight: 400; color: #645c50; }
  img.s16 { width: 16px; height: 16px; } img.s32 { width: 32px; height: 32px; } img.s48 { width: 48px; height: 48px; } img.s96 { width: 96px; height: 96px; }
  .strips { display: flex; flex-direction: column; gap: 6px; }
  .tabs { display: flex; gap: 2px; background: #dcd3c4; padding: 6px 6px 0; border-radius: 8px 8px 0 0; }
  .tabs.dark { background: #202124; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 8px 8px 0 0; background: #e9e0d2; font-size: 11.5px; width: 104px; white-space: nowrap; overflow: hidden; }
  .dark .tab { background: #35363a; color: #e8eaed; }
  .tab.me { background: #f9f4ed; } .dark .tab.me { background: #4a4b50; }
  .tab img { flex: none; }
</style></head><body>
<h1>Nightreader favicon options, round 2 (indigo kept)</h1>
<div id="rows"></div>
<script>
  const own = [['b-crescent-night', 'Now · B', 'crescent and star (chosen November 10th)'], ['d-gibbous', 'D · a fat Moon', 'matches the mark in the page header'], ['e-crescent-only', 'E · crescent alone', 'no star'], ['f-saturn', 'F · Saturn', 'a planet with its rings'], ['g-moonrise', 'G · Moon on the horizon', 'the fat Moon rising, a partner to Lightreader’s Sun'], ['h-plough', 'H · the Plough', 'its seven stars, joined']];
  const family = ['clockmaker', 'backtimer', 'flowcharter', 'hindcaster', 'lightreader', 'refueller', 'riverwatcher', 'baish'];
  const name = (o) => o === 'baish' ? 'baish.net' : o[0].toUpperCase() + o.slice(1)
  const strip = (f, dark) => `<div class="tabs${dark ? ' dark' : ''}">${family.map((o) => `<div class="tab"><img class="s16" src="favicon-options/${o}.svg">${name(o)}</div>`).join('')}<div class="tab me"><img class="s16" src="favicon-options/${f}.svg">Nightreader</div></div>`
  document.getElementById('rows').innerHTML = own.map(([f, title, sub]) => `
    <div class="row"><div class="label">${title}<small>${sub}</small></div>
      <img class="s16" src="favicon-options/${f}.svg"><img class="s32" src="favicon-options/${f}.svg"><img class="s48" src="favicon-options/${f}.svg"><img class="s96" src="favicon-options/${f}.svg">
      <div class="strips">${strip(f, false)}${strip(f, true)}</div></div>`).join('');
</script></body></html>
